[project]
name = "create-buxo-app"
version = "0.1.0"
description = "Scaffold a Next.js + TypeScript + Tailwind site with a generated Material 3 theme, tests, CI, and a git repo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.1.0",
    "rich>=13.9.0",
]

[project.scripts]
create-buxo-app = "create_buxo_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/create_buxo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
